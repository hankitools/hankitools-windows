name: Windows build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Checks, UI smoke test and candidate package
    runs-on: windows-2022
    timeout-minutes: 25
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install .NET 10 SDK
        id: dotnet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Select installed .NET 10 SDK
        shell: pwsh
        env:
          SDK_VERSION: ${{ steps.dotnet.outputs.dotnet-version }}
        run: |
          @{ sdk = @{ version = $env:SDK_VERSION; rollForward = 'latestPatch' } } |
            ConvertTo-Json -Depth 3 | Set-Content global.json -Encoding utf8
          dotnet --info
          if ($LASTEXITCODE -ne 0) { throw 'SDK selection failed.' }

      # Windows PowerShell matches BUILD-WINDOWS.cmd and its Add-Type references.
      - name: Run checks and build Windows candidate
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Start-Transcript -Path build-transcript.txt
          try {
            & .\BUILD-WINDOWS.ps1
          } finally {
            Stop-Transcript
          }

      # TEMPORARY review aid for the display-scaling fix: the UI check again at a simulated 150% scale, and those
      # screenshots as base64 JPEG in the job log. Removed before the PR is opened.
      - name: Print UI screenshots at 150%
        if: always()
        shell: pwsh
        run: |
          $exe = Get-ChildItem dist -Recurse -Filter HankiTools.exe | Select-Object -First 1
          $out = Join-Path $PWD 'dist\ui-screenshots-150'
          $report = Join-Path $PWD 'dist\ui-smoke-150.json'
          $env:HANKI_UI_SCALE = '1.5'
          $p = Start-Process -FilePath $exe.FullName -ArgumentList @('--ui-smoke-test', ('"' + $report + '"'), ('"' + $out + '"')) -PassThru
          if (-not $p.WaitForExit(120000)) { $p.Kill(); 'TIMEOUT' }
          "EXIT $($p.ExitCode)"
          if (Test-Path "$report.progress.txt") { Get-Content "$report.progress.txt" -Tail 5 }
          if (Test-Path $report) { Get-Content $report -Raw | ConvertFrom-Json | Select-Object Passed, Dpi, Scale, Size, Error, ScreenshotError | Format-List | Out-String }
          Add-Type -AssemblyName System.Drawing
          $codec = [System.Drawing.Imaging.ImageCodecInfo]::GetImageEncoders() | Where-Object MimeType -eq 'image/jpeg'
          $options = New-Object System.Drawing.Imaging.EncoderParameters 1
          $options.Param[0] = New-Object System.Drawing.Imaging.EncoderParameter ([System.Drawing.Imaging.Encoder]::Quality), 72L
          foreach ($file in Get-ChildItem "$out/*.png" -ErrorAction SilentlyContinue) {
            $image = [System.Drawing.Image]::FromFile($file.FullName)
            $stream = New-Object System.IO.MemoryStream
            $image.Save($stream, $codec, $options)
            $b64 = [Convert]::ToBase64String($stream.ToArray())
            "SHOT-BEGIN $($file.BaseName)"
            for ($i = 0; $i -lt $b64.Length; $i += 4000) { 'SHOT ' + $b64.Substring($i, [Math]::Min(4000, $b64.Length - $i)) }
            "SHOT-END $($file.BaseName)"
            $image.Dispose()
          }

      - name: Upload unsigned test candidate and checksum
        uses: actions/upload-artifact@v4
        with:
          name: HankiTools-win-x64-candidate-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            dist/*-candidate.zip
            dist/*-candidate.zip.sha256
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Windows-build-diagnostics-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            build-transcript.txt
            dist/**/ui-smoke.json
            dist/**/ui-smoke.json.progress.txt
            dist/**/build-info.json
            dist/ui-screenshots/*.png
          if-no-files-found: warn
          retention-days: 14
